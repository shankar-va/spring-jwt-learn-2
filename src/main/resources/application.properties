# ==================================
# Application & Server Settings
# ==================================
spring.application.name=spring_jwt-learn
server.port=8082
# ==================================
# Database Configuration (PostgreSQL)
# ==================================
spring.datasource.url=jdbc:postgresql://localhost:5432/security
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver
# ==================================
# JPA / Hibernate Configuration
# ==================================
# Controls auto DDL generation: update, validate, create, create-drop, or none
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Open-In-View pattern setting (disabled to avoid keeping DB sessions open unnecessarily)
spring.jpa.open-in-view=false
# Enable/Disable automatic restart (Defaults to true)
spring.devtools.restart.enabled=true
# Exclude static assets from triggering full server restarts (they will just reload)
spring.devtools.restart.exclude=static/**,templates/**
logging.level.org.springframework.security=TRACE